<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --bg: #ffffff; --panel: #f7f8fa; --line: #e2e8f0; --ink: #1a202c; --muted: #5a6677; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  #top {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 32px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #top h1 { font-size: 18px; margin: 0 0 4px; }
  #top p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .legend { display: flex; align-items: center; gap: 36px; font-size: 12px; }
  .legend .caption { font-weight: 600; margin-bottom: 6px; white-space: nowrap; }
  .ramp { width: 330px; }
  .ramp .bar {
    height: 12px;
    border-radius: 3px;
    background: linear-gradient(to right, rgb(47,111,176), rgb(244,241,236), rgb(217,130,43));
  }
  .ramp .ticks {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
    color: var(--muted);
    white-space: nowrap;
  }
  .keys { display: flex; flex-direction: column; gap: 5px; }
  .key { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .key i { display: inline-block; width: 26px; flex: none; }
  .key .best { height: 5px; background: #e8590c; border-radius: 3px; }
  .key .dash { height: 0; border-top: 2px dashed #8b5cf6; }
  .key .last { height: 12px; background: rgba(246,201,69,.7); border: 1px solid #c9a227; }
  .layout { display: flex; flex: 1; min-height: 0; }
  #canvas { flex: 1; min-width: 0; overflow: hidden; cursor: grab; background: #ffffff; }
  #canvas.dragging { cursor: grabbing; }
  #canvas svg { width: 100%; height: 100%; display: block; }
  aside {
    width: 340px;
    flex: none;
    padding: 16px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow: auto;
    box-sizing: border-box;
  }
  aside h2 { font-size: 15px; margin: 0 0 4px; }
  aside p { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  tr.undrawn td { color: #94a3b8; }
  #board { width: 100%; max-width: 308px; display: block; margin: 8px 0 12px; border-radius: 4px; }
  .node { cursor: pointer; }
  .node:hover > .card { stroke: #e53e3e; stroke-width: 4; }
  svg.focus .edge:not(.hl), svg.focus .pill:not(.hl) { opacity: 0.12; }
  svg.focus .node:not(.hl) { opacity: 0.4; }
  .edge.hl path { stroke-opacity: 1 !important; }
  .node.pinned > .card { stroke: #e53e3e; stroke-width: 4; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
<header id="top">
  <div>
    <h1>__TITLE__</h1>
    <p>__SUBTITLE__</p>
  </div>
  __LEGEND__
</header>
<div class="layout">
  <div id="canvas">__SVG__</div>
  <aside>
    <h2 id="title"></h2>
    <p id="subtitle"></p>
    <svg id="board" viewBox="0 0 88 88"></svg>
    <table>
      <thead>
        <tr><th>Move</th><th>Score</th><th>Depth</th><th>Window</th><th>Nodes</th></tr>
      </thead>
      <tbody id="moves"></tbody>
    </table>
    <p class="hint">
      Hover a card to see its position and every move tried there. Click to pin it. Drag to pan,
      scroll to zoom, double-click to reset, press F to fit the whole tree and G to hide the grid.
      Grayed moves are not drawn.
    </p>
  </aside>
</div>
<script id="tree-data" type="application/json">__DATA__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('tree-data').textContent);
  const byId = new Map(data.nodes.map(n => [n.id, n]));
  const canvas = document.getElementById('canvas');
  const svg = canvas.querySelector('svg');
  const full = svg.viewBox.baseVal;
  const home = { x: full.x, y: full.y, width: full.width, height: full.height };
  let view = { ...home };

  const applyView = () =>
    svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.width} ${view.height}`);

  svg.removeAttribute('width');
  svg.removeAttribute('height');

  const rootNode = data.nodes[0];

  const fitAll = () => {
    const box = canvas.getBoundingClientRect();
    const scale = Math.min(box.width / home.width, box.height / home.height);
    view = { x: 0, y: 0, width: box.width / scale, height: box.height / scale };
    applyView();
  };

  // Start at a readable zoom, centered on the root, so that a tall tree does not shrink to
  // a thumbnail.
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const scale = Math.max(Math.min(box.width / home.width, box.height / home.height), 0.55);
    const width = box.width / scale;
    const height = box.height / scale;
    const x = Math.max(0, Math.min(rootNode.x - width / 2, home.width - width));
    view = { x: width >= home.width ? 0 : x, y: 0, width, height };
    applyView();
  };

  fit();
  window.addEventListener('resize', fit);

  const grid = svg.getElementById('grid');

  window.addEventListener('keydown', (event) => {
    if (event.key === 'f' || event.key === 'F') fitAll();
    if ((event.key === 'g' || event.key === 'G') && grid) {
      grid.style.display = grid.style.display === 'none' ? '' : 'none';
    }
  });

  const toSvg = (event) => {
    const box = svg.getBoundingClientRect();
    return { x: view.x + (event.clientX - box.left) / box.width * view.width,
             y: view.y + (event.clientY - box.top) / box.height * view.height };
  };

  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();

    const point = toSvg(event);
    const factor = Math.exp(event.deltaY * 0.0015);
    view = { x: point.x - (point.x - view.x) * factor, y: point.y - (point.y - view.y) * factor,
             width: view.width * factor, height: view.height * factor };
    applyView();
  }, { passive: false });

  let drag = null;

  canvas.addEventListener('mousedown', (event) => {
    drag = { x: event.clientX, y: event.clientY, view: { ...view } };
    canvas.classList.add('dragging');
  });

  window.addEventListener('mouseup', () => { drag = null; canvas.classList.remove('dragging'); });

  window.addEventListener('mousemove', (event) => {
    if (!drag) return;
    const box = svg.getBoundingClientRect();
    view.x = drag.view.x - (event.clientX - drag.x) / box.width * view.width;
    view.y = drag.view.y - (event.clientY - drag.y) / box.height * view.height;
    applyView();
  });

  canvas.addEventListener('dblclick', fit);

  const glyphs = { p: '♟︎', n: '♞︎', b: '♝︎', r: '♜︎', q: '♛︎', k: '♚︎' };
  const boardSvg = document.getElementById('board');

  const drawBoard = (node) => {
    let markup = '';
    for (let i = 0; i < 64; i++) {
      const row = Math.floor(i / 8), col = i % 8;
      const light = (row + col) % 2 === 0;
      const fill = light ? '#edf0f5' : '#8e9bb2';
      markup += `<rect x="${4 + col * 10}" y="${row * 10}" width="10" height="10" fill="${fill}"/>`;

      if (node.last && (node.last[0] === i || node.last[1] === i)) {
        markup += `<rect x="${4 + col * 10}" y="${row * 10}" width="10" height="10" ` +
          `fill="#f6c945" fill-opacity="0.7"/>`;
      }
    }

    for (let r = 0; r < 8; r++) {
      markup += `<text x="1.6" y="${r * 10 + 6.4}" font-size="3.4" text-anchor="middle" ` +
        `fill="#5a6677">${8 - r}</text>`;
      markup += `<text x="${4 + r * 10 + 5}" y="86.4" font-size="3.4" text-anchor="middle" ` +
        `fill="#5a6677">${'abcdefgh'[r]}</text>`;
    }

    for (let i = 0; i < 64; i++) {
      const c = node.board[i];
      if (c === '.') continue;

      const white = c === c.toUpperCase();
      const row = Math.floor(i / 8), col = i % 8;
      const fill = white ? '#ffffff' : '#1c1c1c';
      const stroke = white ? '#1c1c1c' : '#ffffff';
      markup += `<text x="${4 + col * 10 + 5}" y="${row * 10 + 8.2}" font-size="9.4" ` +
        `text-anchor="middle" fill="${fill}" stroke="${stroke}" stroke-width="0.5" ` +
        `paint-order="stroke">${glyphs[c.toLowerCase()]}</text>`;
    }

    boardSvg.innerHTML = markup;
  };

  const show = (id) => {
    const node = byId.get(id);

    document.getElementById('title').textContent = `#${node.id} ${node.label}`;
    document.getElementById('subtitle').textContent =
      `${node.mover === 'w' ? 'White' : 'Black'} to move, ` +
      `evaluation ${node.score} (White's side), ` +
      `${node.quiescence ? 'quiescence' : 'depth ' + node.depth}, ` +
      `window [${node.alpha}, ${node.beta}], ` +
      `${node.searched} of ${node.total} moves searched, ${node.nodes} positions below` +
      (node.cutoff ? ', beta cutoff' : '') + (node.tt ? ', answered by the hash table' : '') +
      (node.terminal ? ', game over' : '');

    drawBoard(node);

    document.getElementById('moves').innerHTML = node.moves.map(m =>
      `<tr class="${m.drawn ? '' : 'undrawn'}">` +
      `<td>${m.move}${m.cutoff ? ' ✂' : ''}${m.tt ? ' #' : ''}</td><td>${m.score}</td>` +
      `<td>${m.quiescence ? 'q' : m.depth}</td><td>[${m.alpha}, ${m.beta}]</td>` +
      `<td>${m.nodes}</td></tr>`).join('');
  };

  const clearHighlight = () => {
    svg.classList.remove('focus');
    svg.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
  };

  const highlight = (id) => {
    clearHighlight();
    svg.classList.add('focus');
    let current = id;

    while (current !== null && current !== undefined) {
      const node = byId.get(current);
      svg.getElementById('n' + current).classList.add('hl');

      if (node.parent === null) break;

      const selector = `.edge[data-from="${node.parent}"][data-to="${current}"]`;
      svg.querySelectorAll(selector).forEach(edge => {
        edge.classList.add('hl');
        const pill = edge.querySelector('.pill');
        if (pill) pill.classList.add('hl');
      });

      current = node.parent;
    }
  };

  let pinned = null;
  const root = data.nodes[0].id;

  show(root);

  svg.addEventListener('mouseover', (event) => {
    const group = event.target.closest('.node');
    if (!group) return;

    const id = Number(group.dataset.id);

    show(id);
    highlight(id);
  });

  svg.addEventListener('mouseout', (event) => {
    if (!event.target.closest('.node')) return;
    if (pinned === null) { clearHighlight(); show(root); } else { show(pinned); highlight(pinned); }
  });

  svg.addEventListener('click', (event) => {
    const group = event.target.closest('.node');

    svg.querySelectorAll('.pinned').forEach(el => el.classList.remove('pinned'));

    if (!group || Number(group.dataset.id) === pinned) { pinned = null; return; }

    pinned = Number(group.dataset.id);
    group.classList.add('pinned');
  });
})();
</script>
</body>
</html>
