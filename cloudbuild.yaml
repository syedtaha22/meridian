steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

  - name: gcr.io/cloud-builders/gcloud
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # Search is CPU bound, so a request should have a core to itself. Each worker
      # thread owns a transposition table (CHESS_HASH_MB), which sets the memory floor.
      - --cpu=2
      - --memory=512Mi
      - --concurrency=4
      # A burst of requests cannot start more instances than this, which bounds the cost.
      - --max-instances=3

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID

substitutions:
  _REGION: asia-south1
  _REPOSITORY: chess-backend
  _SERVICE: chess-backend

# Required once a non-default service account is set on the build: the legacy
# GCS-bucket log storage is not compatible with a custom service account, so logs
# must be routed to Cloud Logging explicitly instead.
options:
  logging: CLOUD_LOGGING_ONLY
