name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure

  # The tests run again under AddressSanitizer and UndefinedBehaviorSanitizer, which is
  # where an out-of-range index or a use after free in the engine would show up.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCHESS_SANITIZE=ON
      - run: cmake --build build-asan -j 2
      - run: ctest --test-dir build-asan --output-on-failure

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chess-backend .
