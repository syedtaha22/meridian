name: Release

# Builds the program for Linux on x86-64 and on ARM64 when a release is published, and attaches
# the archives to it. The programs are linked statically, so that they run on any Linux.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCHESS_STATIC=ON
      - run: cmake --build build -j 2 --target meridian
      - run: build/meridian bench 8
      - run: cpack
        working-directory: build
      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.runner }}
          path: build/meridian-*.tar.gz
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" build/meridian-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
