name: Sync site submodule

# Only fires when frontend/ actually changed: backend/ changes are irrelevant to what the site
# needs (it never imports backend/ at all), and a naive unconditional sync would create a noisy
# submodule-bump commit on the site's main for every backend-only change, plus a pointlessly
# larger clone of this whole repo (a submodule pulls the entire repo, backend/ included).
on:
  push:
    branches: [main]
    paths: ['frontend/**']

jobs:
  sync-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          repository: syedtaha22/syedtaha22.github.io
          token: ${{ secrets.PWEBSITE_CHESS_SYNC_TOKEN }}
          submodules: true

      - name: Bump vendor/chess submodule to this commit
        run: |
          if [ ! -e vendor/chess/.git ]; then
            echo "The site has no vendor/chess submodule yet, nothing to sync."
            exit 0
          fi

          cd vendor/chess
          git fetch origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"
          cd ../..

          if git diff --quiet -- vendor/chess; then
            echo "vendor/chess submodule already up to date, nothing to sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/chess
          git commit -m "Sync vendor/chess submodule to chess@${GITHUB_SHA:0:7}"
          git push
