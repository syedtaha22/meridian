name: Bug report
description: The engine or a tool does something wrong.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Engine (a wrong or illegal move, a crash, a hang)
        - UCI program (commands, options, time management)
        - Benchmarks or tools
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen instead
    validations:
      required: true
  - type: textarea
    id: position
    attributes:
      label: Position and moves
      description: The FEN the game started from and the UCI moves played since, for a position.
      placeholder: "fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1, moves: e2e4 e7e5"
  - type: textarea
    id: session
    attributes:
      label: UCI session
      description: For a UCI problem, the commands sent and what came back.
      render: text
  - type: input
    id: version
    attributes:
      label: Engine version and settings
      description: The version from the `id name` line, and the depth and time limit used.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, compiler, and how the engine was started.
